<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Surat Pernyataan</title>
<style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { text-align: center; }
    .content { margin-top: 30px; }
    .signature { margin-top: 50px; display: flex; justify-content: space-between; }
    .line { border-bottom: 1px solid #000; width: 200px; }
</style>
</head>
<body>
    <h1>SURAT PERNYATAAN</h1>
    <p>Yang bertanda tangan di bawah ini:</p>
    <p>Nama Lengkap: <span class="line"></span></p>
    <p>Tempat, Tanggal Lahir: <span class="line"></span></p>
    <p>Alamat: <span class="line"></span></p>
    <p>Dengan ini menyatakan bahwa data yang saya isikan adalah benar.</p>
    <p>Demikian surat pernyataan ini saya buat dengan sebenarnya.</p>
    <div class="signature"><div>Liwa, ______________ 2026</div><div>Yang Membuat Pernyataan</div></div>
    <div class="signature" style="margin-top: 30px;"><div></div><div>(______________)</div></div>
</body>
</html>
