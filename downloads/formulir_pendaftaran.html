<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Formulir Pendaftaran PPDB</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; color: #0d47a1; }
    .section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    .section-title { background: #0d47a1; color: white; padding: 8px; margin: -15px -15px 15px -15px; border-radius: 8px 8px 0 0; }
    .field { margin: 10px 0; }
    .label { font-weight: bold; display: inline-block; width: 180px; }
    .line { border-bottom: 1px solid #000; display: inline-block; width: 250px; }
    .signature { margin-top: 40px; display: flex; justify-content: space-between; }
    .footer { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
    <h1>SMK N 1 LIWA</h1>
    <h2 style="text-align:center;">FORMULIR PENDAFTARAN PPDB</h2>
    <div class="section">
        <div class="section-title">A. DATA PRIBADI</div>
        <div class="field"><span class="label">Nama Lengkap:</span> <span class="line"></span></div>
        <div class="field"><span class="label">NISN:</span> <span class="line"></span></div>
        <div class="field"><span class="label">Tempat, Tanggal Lahir:</span> <span class="line"></span></div>
        <div class="field"><span class="label">Alamat:</span> <span class="line"></span></div>
        <div class="field"><span class="label">No Telepon:</span> <span class="line"></span></div>
    </div>
    <div class="section">
        <div class="section-title">B. DATA ORANG TUA</div>
        <div class="field"><span class="label">Nama Ayah:</span> <span class="line"></span></div>
        <div class="field"><span class="label">Nama Ibu:</span> <span class="line"></span></div>
    </div>
    <div class="signature">
        <div>Calon Siswa,</div>
        <div>Orang Tua,</div>
    </div>
    <div class="footer"><p>&copy; 2026 SMK N 1 LIWA</p></div>
</body>
</html>
